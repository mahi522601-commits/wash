<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Tech Wash Laundry Services — Next-Gen Premium Garment Care</title>
    <meta name="description" content="Experience technology-driven premium laundry, dry cleaning, steam ironing & shoe care with hygienic doorstep pickup and express delivery." />
    
    <!-- PWA & Mobile App Manifest Configuration -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F97316" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tech Wash" />
    <meta name="application-name" content="Tech Wash" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Favicons & App Launcher Icons -->
    <link rel="icon" type="image/webp" href="/techwashlogo.webp" />
    <link rel="apple-touch-icon" href="/techwashlogo.webp" />
    <link rel="apple-touch-icon" sizes="192x192" href="/techwashlogo.webp" />
    <link rel="apple-touch-icon" sizes="512x512" href="/techwashlogo.webp" />
    
    <!-- Google Fonts for Luxury Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  </head>
    <div id="root">
      <!-- High-End Tech Wash Initial Boot Preloader (disappears upon React mount) -->
      <div id="techwash-preloader" style="position:fixed;inset:0;background:radial-gradient(circle at 50% 50%,#FFF7ED 0%,#FAFAFA 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999999;font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-user-select:none;user-select:none;">
        <style>
          @keyframes twPrePulse{0%,100%{transform:scale(1) translateY(0);filter:drop-shadow(0 12px 28px rgba(249,115,22,0.3));}50%{transform:scale(1.06) translateY(-4px);filter:drop-shadow(0 18px 36px rgba(249,115,22,0.45));}}
          @keyframes twPreOrbit{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
          @keyframes twPreOrbitRev{0%{transform:rotate(360deg);}100%{transform:rotate(0deg);}}
          @keyframes twPreShine{0%{transform:translateX(-150%) skewX(-20deg);opacity:0;}30%,70%{opacity:0.6;}100%{transform:translateX(250%) skewX(-20deg);opacity:0;}}
          @keyframes twPreBar{0%{width:10%;}50%{width:75%;}100%{width:95%;}}
          @keyframes twPreText{0%,100%{opacity:0.75;}50%{opacity:1;}}
        </style>
        <div style="position:relative;width:140px;height:140px;display:flex;align-items:center;justify-content:center;">
          <!-- Ambient Glow Aura -->
          <div style="position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,rgba(249,115,22,0.25) 0%,rgba(168,85,247,0.15) 50%,transparent 70%);filter:blur(20px);"></div>
          
          <!-- Outer Orbit Ring -->
          <div style="position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(249,115,22,0.45);animation:twPreOrbit 10s linear infinite;">
            <div style="position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:#F97316;box-shadow:0 0 10px #F97316;"></div>
          </div>

          <!-- Inner Counter Ring -->
          <div style="position:absolute;inset:10px;border-radius:50%;border:2px solid transparent;border-top-color:#F97316;border-bottom-color:#9333EA;animation:twPreOrbitRev 6s linear infinite;"></div>

          <!-- Glassmorphic Logo Shield -->
          <div style="position:relative;width:86px;height:86px;border-radius:24px;background:rgba(255,255,255,0.95);border:2px solid #FED7AA;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(249,115,22,0.25);overflow:hidden;animation:twPrePulse 3s ease-in-out infinite;">
            <!-- Specular Light Sheen -->
            <div style="position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.7),transparent);animation:twPreShine 2.5s ease-in-out infinite;pointer-events:none;"></div>
            <!-- Tech Wash Logo -->
            <img src="/techwashlogo.webp" alt="Tech Wash" style="width:62px;height:62px;object-fit:contain;z-index:2;" />
          </div>
        </div>

        <div style="margin-top:24px;text-align:center;">
          <div style="font-family:'Outfit',sans-serif;font-size:16px;font-weight:800;color:#1F2937;letter-spacing:-0.02em;animation:twPreText 2s ease-in-out infinite;">
            TECH <span style="color:#F97316;">WASH</span>
          </div>
          <div style="font-size:11px;font-weight:600;color:#6B7280;margin-top:4px;letter-spacing:0.02em;">
            Next-Gen Premium Garment Care
          </div>

          <!-- Progress Bar -->
          <div style="width:160px;height:4px;border-radius:99px;background:#FED7AA;margin:14px auto 0;overflow:hidden;position:relative;">
            <div style="height:100%;border-radius:99px;background:linear-gradient(90deg,#EA580C,#F97316,#FBBF24);animation:twPreBar 2s ease-out infinite;"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register PWA Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('[PWA] ServiceWorker registration notice:', err);
          });
        });
      }
    </script>
  </body>
</html>
